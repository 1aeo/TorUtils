# Generated by mkconf.py from /work/net/nodes.1792665999
# Private chutney test network only. Run arti with
#   arti proxy -c <this file> --disable-fs-permission-checks

[application]
allow_running_as_root = true   # lab containers run as root
permit_debugging = true
watch_configuration = false

[proxy]
socks_listen = "127.0.0.1:9400"   # IPv4 loopback only
dns_listen = 0

[logging]
console = "warn"
log_sensitive_information = true   # show onion addrs + relay ids
protocol_warnings = true
time_granularity = "1ms"   # lab only: sub-second attempt timing
files = [ { path = "/work/arti/arti.log", filter = "info,tor_hsclient=trace,tor_dirclient=debug,tor_circmgr=debug,arti::proxy=debug" } ]

[storage]
cache_dir = "/work/arti/cache"
state_dir = "/work/arti/state"

[storage.permissions]
dangerously_trust_everyone = true

[path_rules]
# Disable the same-subnet rule so loopback relays can share a path.
ipv4_subnet_family_prefix = 33
ipv6_subnet_family_prefix = 129

[address_filter]
allow_local_addrs = true
allow_onion_addrs = true

[circuit_timing]

[override_net_params]
# = SR rounds(12) * phases(2) * V3AuthVotingInterval / 60, as C tor
# computes it under TestingTorNetwork.
hsdir_interval = 8
# Floor for learned circuit timeouts (lab realism, see --help).
cbtmintimeout = 2000

